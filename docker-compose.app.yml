# 机器 A — 应用服务（Frontend + Backend + MySQL）
services:
  frontend:
    image: infomoth-frontend:latest
    build: 
      context: ./Frontend
      platforms:
        - linux/amd64
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Config/deploy-config.json:/Config/app-config.json:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: infomoth-backend:latest
    build: 
      context: ./Backend
      platforms:
        - linux/amd64
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
      - SENTIMENT_PERSISTENCE_ENABLED=true
    volumes:
      - ./Shared:/app/Shared
      - ./Config/deploy-config.json:/Config/app-config.json:ro
      - ./Schema:/Schema:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
