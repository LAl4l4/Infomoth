spring:
  application:
    name: Back


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations:
        - file:../Schema/01-user.sql
        - file:../Schema/02-profiles.sql
        - file:../Schema/03-user-settings.sql
        - file:../Schema/04-sentiment-average.sql
        - file:../Schema/05-us-stock-indices.sql
        - file:../Schema/06-user-settings-currency.sql
  
  
server:
  port: 8080


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: ReleaseBack.Back.entity
  configuration:
    map-underscore-to-camel-case: true

sentiment:
  persistence:
    enabled: ${SENTIMENT_PERSISTENCE_ENABLED:false}
    initial-delay-ms: ${SENTIMENT_PERSISTENCE_INITIAL_DELAY_MS:30000}
    fixed-delay-ms: ${SENTIMENT_PERSISTENCE_FIXED_DELAY_MS:900000}
