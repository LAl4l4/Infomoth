# 机器 B — 数据管道（Crawler + Analyser）
# 用法:
#   单次运行: docker compose -f docker-compose.pipeline.yml run --rm pipeline
#   定时运行: docker compose -f docker-compose.pipeline.yml up -d (配合 host cron)
services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - ./Shared:/app/Shared
      - ./Config/deploy-config.json:/app/Config/app-config.json:ro
      - ./models:/root/.cache/huggingface
      - ssh_key:/root/.ssh
    restart: "no"

volumes:
  ssh_key:
